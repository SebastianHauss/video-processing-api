---
spring:
  application:
    name: video-platform
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      # Schema is owned by Flyway; Hibernate only checks the entities match it.
      ddl-auto: validate

minio:
  url: ${MINIO_URL}
  port: ${MINIO_PORT:9000}
  user: ${MINIO_USER}
  password: ${MINIO_PASSWORD}
  bucket: ${MINIO_BUCKET:videos}

ffmpeg:
  path: ${FFMPEG_PATH:ffmpeg}

processing:
  poll-interval-ms: ${PROCESSING_POLL_INTERVAL_MS:5000}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
