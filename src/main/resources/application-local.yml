---
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/videoplatform
    username: video
    password: video
  jpa:
    hibernate:
      # Flyway owns the schema here too; validate against it.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    # Adopt an existing local DB that predates Flyway instead of erroring on it.
    baseline-on-migrate: true