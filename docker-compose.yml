services:
  postgres:
    image: postgres:16
    container_name: videoplatform-postgres
    environment:
      POSTGRES_DB: videoplatform
      POSTGRES_USER: video
      POSTGRES_PASSWORD: video
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: videoplatform-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  app:
    build: .
    container_name: videoplatform-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/videoplatform
      SPRING_DATASOURCE_USERNAME: video
      SPRING_DATASOURCE_PASSWORD: video
      MINIO_URL: http://minio
      MINIO_PORT: 9000
    depends_on:
      - postgres
      - minio

volumes:
  postgres_data:
  minio_data: