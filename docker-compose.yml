---
services:
  postgres:
    image: postgres:16
    container_name: videoplatform-postgres
    environment:
      POSTGRES_DB: videoplatform
      POSTGRES_USER: video
      POSTGRES_PASSWORD: video
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  minio:
    image: minio/minio:latest
    container_name: videoplatform-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
volumes:
  postgres_data: null
  minio_data: null
